{% extends 'base.html' %}

{% block title %}Select Movie{% endblock %}

{% block content %}
<div class="container">
    <h1 class="heading">Select Movie</h1>
    {% if not options %}
    <p class="description">No movies found - <a href="{{ url_for('add_movie') }}">try another title</a>.</p>
    {% endif %}
    {% for option in options %}
  <p>
    <a href="{{ url_for('find_movie', id=option.id) }}"> {{option.title}} - {{option.release_date}}</a>
  </p>
    {% endfor %}

</div>
{% endblock %}
